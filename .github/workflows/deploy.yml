name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

      - name: Copy generated pitch pages to dist
        run: |
          # Copy all generated pitch folders (those with index.html) to dist
          shopt -s nullglob
          for dir in */; do
            # Strip trailing slash
            dirname="${dir%/}"
            # Skip known build/config directories
            case "$dirname" in
              node_modules|dist|src|public|.github|.git)
                continue
                ;;
            esac
            # Check if directory contains index.html
            if [ -f "${dirname}/index.html" ]; then
              echo "Copying ${dirname}/ to dist/"
              cp -r "${dirname}" dist/
            fi
          done
          echo "Contents of dist:"
          ls -la dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
